# EduCatalog V3 — ยืนยัน runtime เดียวกับ Docker/Python ชุดภาพ และ engines ใน package.json (กัน drift ระหว่างเครื่องกับ staging)
#
# Backend image: backend/Dockerfile.dev → python:3.12-slim
# Frontend:       frontend/package.json → engines.node >=20

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12 (ตรงกับ Dockerfile.dev)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Fail if interpreter is not 3.12.x
        shell: bash
        run: |
          py=$(python -c "import sys; print('%d.%d' % sys.version_info[:2])")
          if [[ "$py" != "3.12" ]]; then
            echo "Expected Python 3.12, got $py"
            exit 1
          fi
          python --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (ไม่ boot FastAPI lifespan / DB)
        run: python -m pytest tests/unit -v --tb=short

  frontend:
    name: Frontend (Node 20 LTS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20 (ตรงกับ engines >=20)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fail if Node is not v20.x
        shell: bash
        run: |
          major=$(node -p "process.versions.node.split('.')[0]")
          if [[ "$major" != "20" ]]; then
            echo "Expected Node major 20, got v$(node -v)"
            exit 1
          fi
          node -v

      - name: Install and verify
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
