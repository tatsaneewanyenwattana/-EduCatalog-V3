# =======================================================
# EduCatalog V3 — Nginx Dev Reverse Proxy
# -------------------------------------------------------
# entry point เดียวของ dev environment (http://localhost)
# routing:
#   /api/*     → backend  (FastAPI)
#   /health    → backend
#   /minio/*   → minio    (console UI)
#   /flower/*  → flower   (celery monitor)
#   /*         → frontend (Next.js + HMR websocket)
# =======================================================


worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # log format JSON เพื่อตรงกับกฎ H6 (backend ก็ JSON log)
    log_format json_combined escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"upstream":"$upstream_addr",'
            '"upstream_time":"$upstream_response_time",'
            '"request_time":$request_time'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip — ลดขนาด response (กฎ scope: dev เปิดได้ ไม่กระทบ perf test)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # อัปโหลดไฟล์สูงสุด — ต้องเท่ากับ UPLOAD_MAX_SIZE_MB ใน backend/.env (กฎ D6)
    client_max_body_size 100M;

    # -------------------------------------------------------
    # Upstreams — ปลายทางใน docker network
    # -------------------------------------------------------
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:3000;
        keepalive 32;
    }

    upstream minio_console {
        server minio:9001;
        keepalive 32;
    }

    upstream flower_ui {
        server flower:5555;
        keepalive 32;
    }

    # -------------------------------------------------------
    # Main server
    # -------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        # endpoint สำหรับ docker healthcheck — ไม่ proxy ออกไปไหน
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ----- Backend API -----
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # backend /health (แยกออกเพราะไม่ได้อยู่ใต้ /api)
        location = /health {
            proxy_pass http://backend_api/health;
            access_log off;
        }

        # backend /docs, /redoc, /openapi.json (สำหรับ dev เท่านั้น — prod ปิด DEBUG)
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ----- MinIO console -----
        location /minio/ {
            # strip prefix /minio/ ก่อนส่งต่อไป upstream
            rewrite ^/minio/(.*) /$1 break;
            proxy_pass http://minio_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # MinIO console ใช้ websocket สำหรับ live update
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ----- Flower (celery monitoring) -----
        location /flower/ {
            rewrite ^/flower/(.*) /$1 break;
            proxy_pass http://flower_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ----- Next.js HMR websocket -----
        # ต้องมาก่อน catch-all location / ไม่งั้น HMR จะ disconnect ตลอด
        location /_next/webpack-hmr {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ----- Frontend (catch-all) -----
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # รองรับ websocket (Next.js fast refresh, server actions)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
